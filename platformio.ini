; Configurações globais compartilhadas entre os ambientes
[env]
platform = espressif32
board = esp32dev       ; Altere se sua placa for específica (ex: nodemcu-32s)
framework = arduino
monitor_speed = 115200
lib_deps = 
	madhephaestus/ESP32Servo@^3.0.5

; --------------------------------------------------
; 1. Ambiente Principal (O código final)
; --------------------------------------------------
[env:main]
; Compila apenas o arquivo main.cpp (ignora o calibrador)
build_src_filter = +<main.cpp>

; --------------------------------------------------
; 2. Ambiente de Calibração (Para ajustar os ângulos)
; --------------------------------------------------
[env:calibrador]
; Compila apenas o arquivo calibrador.cpp (ignora o main)
build_src_filter = +<calibrador.cpp>